workflows:
  ios-unsigned:
    name: PocketPal iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        # Metro OOMs (default ~2GB heap) transforming the huge phonemize
        # en-g2p.cjs TTS dataset; give node a bigger heap for every step.
        NODE_OPTIONS: "--max-old-space-size=8192"
      node: 22.21.0
      xcode: latest
    scripts:
      - name: Yarn install
        script: |
          corepack enable
          yarn install --immutable
      - name: Env files (dummy values, OCR only)
        script: |
          cp .env.example .env
          cp ios/Config/Env.xcconfig.example ios/Config/Env.xcconfig
          # The Xcode project copies GoogleService-Info.plist as a bundle
          # resource (Firebase). Firebase pods are commented out and unused for
          # OCR, but the copy phase still needs the file to exist -> dummy it.
          cat > ios/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>dummy</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>com.pocketpalai</string>
            <key>PROJECT_ID</key><string>dummy</string>
            <key>STORAGE_BUCKET</key><string>dummy.appspot.com</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><false/>
            <key>IS_SIGNIN_ENABLED</key><false/>
          </dict>
          </plist>
          PLIST
          # The Xcode "Bundle React Native code and images" phase runs in a
          # shell without nvm/corepack, so pin node's absolute path for it.
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local
          echo "export NODE_OPTIONS=--max-old-space-size=8192" >> ios/.xcode.env.local
          cat ios/.xcode.env.local
      - name: Pod install
        script: |
          cd ios
          # Use the image's system CocoaPods (skip bundler: the Gemfile pins
          # ruby 3.2.3 which mismatches Codemagic's default ruby and breaks
          # `bundle exec`).
          pod install --repo-update
      - name: Pre-bundle JS (surface Metro errors)
        script: |
          node --version
          mkdir -p /tmp/rnassets
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/main.jsbundle \
            --assets-dest /tmp/rnassets
      - name: Build unsigned archive
        script: |
          cd ios
          xcodebuild -workspace PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/PocketPal.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -r PocketPal.xcarchive/Products/Applications/PocketPal.app Payload/
          zip -r PocketPal-unsigned.ipa Payload
    artifacts:
      - PocketPal-unsigned.ipa