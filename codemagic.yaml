workflows:
  ios-unsigned:
    name: PocketPal iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22.21.0
      xcode: latest
    scripts:
      - name: Yarn install
        script: |
          corepack enable
          yarn install --immutable
      - name: Env files (dummy values, OCR only)
        script: |
          cp .env.example .env
          cp ios/Config/Env.xcconfig.example ios/Config/Env.xcconfig
      - name: Pod install
        script: |
          cd ios
          bundle install
          bundle exec pod install
      - name: Build unsigned archive
        script: |
          cd ios
          xcodebuild -workspace PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/PocketPal.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -r PocketPal.xcarchive/Products/Applications/PocketPal.app Payload/
          zip -r PocketPal-unsigned.ipa Payload
    artifacts:
      - PocketPal-unsigned.ipa